<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E6DFD1" stroke-width="1"/></pattern></defs><rect width="1600" height="620" rx="28" fill="#F6F1E7"/><rect width="1600" height="620" rx="28" fill="url(#grid)"/><rect x="1.5" y="1.5" width="1597" height="617" rx="26.5" stroke="#E0D7C7" stroke-width="3"/><text x="48" y="54" fill="#7A8794" font-family="monospace" font-size="14">FQR1 / PROTOCOL V1</text><text x="48" y="108" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Frame anatomy + integrity layers</text><text x="48" y="145" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="21">Every QR frame carries enough metadata to be validated and reconstructed independently.</text><rect x="58" y="202" width="1486" height="166" rx="24" fill="#111820"/><text x="84" y="238" fill="#D7FF64" font-family="monospace" font-size="14">FRAME STRUCTURE</text><g transform="translate(84 264)"><rect width="116" height="62" rx="12" fill="#D7FF64"/><text x="28" y="38" fill="#111820" font-family="monospace" font-size="15">FQR1</text></g><g transform="translate(210 264)"><rect width="104" height="62" rx="12" fill="#F6F1E7"/><text x="22" y="38" fill="#111820" font-family="monospace" font-size="15">FLAGS</text></g><g transform="translate(324 264)"><rect width="144" height="62" rx="12" fill="#F6F1E7"/><text x="22" y="38" fill="#111820" font-family="monospace" font-size="15">SESSION ID</text></g><g transform="translate(478 264)"><rect width="144" height="62" rx="12" fill="#F6F1E7"/><text x="21" y="38" fill="#111820" font-family="monospace" font-size="15">CHUNK IDX</text></g><g transform="translate(632 264)"><rect width="154" height="62" rx="12" fill="#F6F1E7"/><text x="18" y="38" fill="#111820" font-family="monospace" font-size="15">CHUNK COUNT</text></g><g transform="translate(796 264)"><rect width="114" height="62" rx="12" fill="#F6F1E7"/><text x="31" y="38" fill="#111820" font-family="monospace" font-size="15">SIZE</text></g><g transform="translate(920 264)"><rect width="118" height="62" rx="12" fill="#F6F1E7"/><text x="24" y="38" fill="#111820" font-family="monospace" font-size="15">CRC32</text></g><g transform="translate(1048 264)"><rect width="112" height="62" rx="12" fill="#F6F1E7"/><text x="25" y="38" fill="#111820" font-family="monospace" font-size="15">NAME</text></g><g transform="translate(1170 264)"><rect width="154" height="62" rx="12" fill="#D7FF64"/><text x="31" y="38" fill="#111820" font-family="monospace" font-size="15">PAYLOAD</text></g><g transform="translate(1334 264)"><rect width="130" height="62" rx="12" fill="#F6F1E7"/><text x="23" y="38" fill="#111820" font-family="monospace" font-size="15">FRAME CRC</text></g><g transform="translate(58 416)"><rect x="9" y="10" width="458" height="142" rx="20" fill="#111820" opacity=".14"/><rect width="458" height="142" rx="20" fill="#FFFDF8" stroke="#111820" stroke-width="2"/><text x="24" y="34" fill="#7A8794" font-family="monospace" font-size="13">CHECK / 01</text><text x="24" y="72" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Frame CRC32</text><text x="24" y="105" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="17">Rejects a corrupted QR frame before reconstruction.</text></g><g transform="translate(571 416)"><rect x="9" y="10" width="458" height="142" rx="20" fill="#111820" opacity=".14"/><rect width="458" height="142" rx="20" fill="#111820"/><text x="24" y="34" fill="#D7FF64" font-family="monospace" font-size="13">CHECK / 02</text><text x="24" y="72" fill="#F6F1E7" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Transmitted CRC32</text><text x="24" y="105" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="17">Validates reconstructed bytes before decompression.</text></g><g transform="translate(1084 416)"><rect x="9" y="10" width="458" height="142" rx="20" fill="#111820" opacity=".14"/><rect width="458" height="142" rx="20" fill="#FFFDF8" stroke="#111820" stroke-width="2"/><text x="24" y="34" fill="#7A8794" font-family="monospace" font-size="13">CHECK / 03</text><text x="24" y="72" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Final file size + CRC32</text><text x="24" y="105" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="17">Confirms the recovered file matches the original.</text></g></svg>