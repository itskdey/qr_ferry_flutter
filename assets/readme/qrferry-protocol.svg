<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223142" opacity="0.34"/></pattern>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6EE7FF"/><stop offset="1" stop-color="#D8FF72"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#0A0F14"/><rect width="1200" height="300" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="298" rx="23" stroke="#293746" stroke-width="2"/>
  <text x="32" y="38" fill="#748291" font-family="monospace" font-size="12">FQR1 / FRAME ANATOMY</text>
  <text x="32" y="80" fill="#F4F8FC" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Every QR frame carries enough context to stand on its own.</text>
  <text x="32" y="108" fill="#AAB6C3" font-family="Arial,Helvetica,sans-serif" font-size="16">The receiver can join late, collect chunks out of order, reject duplicates, and still rebuild the transfer.</text>

  <g transform="translate(32 145)">
    <rect width="1136" height="68" rx="14" fill="#0F161E" stroke="#2D3A48"/>
    <rect x="14" y="14" width="88" height="40" rx="9" fill="#14212A" stroke="#31505E"/><text x="33" y="39" fill="#6EE7FF" font-family="monospace" font-size="11">FQR1</text>
    <rect x="112" y="14" width="104" height="40" rx="9" fill="#131C25"/><text x="128" y="39" fill="#D6DEE6" font-family="monospace" font-size="10">version + flags</text>
    <rect x="226" y="14" width="120" height="40" rx="9" fill="#131C25"/><text x="246" y="39" fill="#D6DEE6" font-family="monospace" font-size="10">session id</text>
    <rect x="356" y="14" width="142" height="40" rx="9" fill="#131C25"/><text x="376" y="39" fill="#D6DEE6" font-family="monospace" font-size="10">index / total</text>
    <rect x="508" y="14" width="154" height="40" rx="9" fill="#131C25"/><text x="526" y="39" fill="#D6DEE6" font-family="monospace" font-size="10">sizes + CRC32</text>
    <rect x="672" y="14" width="122" height="40" rx="9" fill="#131C25"/><text x="692" y="39" fill="#D6DEE6" font-family="monospace" font-size="10">filename</text>
    <rect x="804" y="14" width="202" height="40" rx="9" fill="#162229" stroke="#35545E"/><text x="873" y="39" fill="#D8FF72" font-family="monospace" font-size="10">binary payload</text>
    <rect x="1016" y="14" width="106" height="40" rx="9" fill="#182027"/><text x="1033" y="39" fill="#7CFFB2" font-family="monospace" font-size="10">frame CRC</text>
  </g>

  <g transform="translate(32 232)">
    <rect width="330" height="42" rx="11" fill="#101720" stroke="#2D3947"/><circle cx="19" cy="21" r="5" fill="#6EE7FF"/><text x="34" y="26" fill="#E9F0F6" font-family="monospace" font-size="11">1 · reject corrupted frame</text>
    <rect x="350" width="330" height="42" rx="11" fill="#101720" stroke="#2D3947"/><circle cx="369" cy="21" r="5" fill="#D8FF72"/><text x="384" y="26" fill="#E9F0F6" font-family="monospace" font-size="11">2 · verify transmitted payload</text>
    <rect x="700" width="436" height="42" rx="11" fill="#101720" stroke="#2D3947"/><circle cx="719" cy="21" r="5" fill="#7CFFB2"/><text x="734" y="26" fill="#E9F0F6" font-family="monospace" font-size="11">3 · verify original size + CRC32</text>
  </g>
  <rect x="32" y="286" width="286" height="4" rx="2" fill="url(#sig)"/>
</svg>