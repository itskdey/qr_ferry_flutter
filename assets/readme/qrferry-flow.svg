<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223142" opacity="0.34"/></pattern>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6EE7FF"/><stop offset="1" stop-color="#D8FF72"/></linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#0A0F14"/><rect width="1200" height="320" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="318" rx="23" stroke="#293746" stroke-width="2"/>
  <text x="32" y="38" fill="#748291" font-family="monospace" font-size="12">TRANSPORT / VISIBLE-LIGHT PIPELINE</text>
  <text x="32" y="82" fill="#F4F8FC" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">The screen and camera become the transport layer.</text>
  <text x="32" y="112" fill="#AAB6C3" font-family="Arial,Helvetica,sans-serif" font-size="16">No socket. No discovery service. No backend. Just numbered binary frames moving through light.</text>

  <g transform="translate(34 154)"><rect width="150" height="104" rx="16" fill="#101720" stroke="#2D3A48"/><text x="16" y="25" fill="#6EE7FF" font-family="monospace" font-size="11">01 / SOURCE</text><text x="16" y="53" fill="#F4F8FC" font-family="Arial" font-size="19" font-weight="700">Read file</text><text x="16" y="76" fill="#8D9AA8" font-family="monospace" font-size="10">bytes + filename</text><text x="16" y="92" fill="#8D9AA8" font-family="monospace" font-size="10">CRC32 + size</text></g>
  <path d="M184 206H236" stroke="#42515F" stroke-width="2"/><path d="M228 200L238 206L228 212" stroke="#6EE7FF" stroke-width="2"/>
  <g transform="translate(238 154)"><rect width="170" height="104" rx="16" fill="#101720" stroke="#2D3A48"/><text x="16" y="25" fill="#6EE7FF" font-family="monospace" font-size="11">02 / ENCODE</text><text x="16" y="53" fill="#F4F8FC" font-family="Arial" font-size="19" font-weight="700">Chunk + frame</text><text x="16" y="76" fill="#8D9AA8" font-family="monospace" font-size="10">optional gzip</text><text x="16" y="92" fill="#8D9AA8" font-family="monospace" font-size="10">metadata + CRC</text></g>
  <path d="M408 206H460" stroke="#42515F" stroke-width="2"/><path d="M452 200L462 206L452 212" stroke="#6EE7FF" stroke-width="2"/>
  <g transform="translate(462 154)"><rect width="170" height="104" rx="16" fill="#111A22" stroke="#3A4B5B"/><text x="16" y="25" fill="#D8FF72" font-family="monospace" font-size="11">03 / BROADCAST</text><text x="16" y="53" fill="#F4F8FC" font-family="Arial" font-size="19" font-weight="700">Render QR</text><text x="16" y="76" fill="#8D9AA8" font-family="monospace" font-size="10">5 / 8 / 12 FPS</text><text x="16" y="92" fill="#8D9AA8" font-family="monospace" font-size="10">repeat sequence</text></g>
  <path d="M632 206H708" stroke="url(#sig)" stroke-width="3" stroke-dasharray="8 7"/><path d="M697 199L710 206L697 213" stroke="#D8FF72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="651" y="192" fill="#7FC8D8" font-family="monospace" font-size="9">LIGHT</text>
  <g transform="translate(710 154)"><rect width="170" height="104" rx="16" fill="#111A22" stroke="#3A4B5B"/><text x="16" y="25" fill="#D8FF72" font-family="monospace" font-size="11">04 / RECEIVE</text><text x="16" y="53" fill="#F4F8FC" font-family="Arial" font-size="19" font-weight="700">Decode camera</text><text x="16" y="76" fill="#8D9AA8" font-family="monospace" font-size="10">deduplicate</text><text x="16" y="92" fill="#8D9AA8" font-family="monospace" font-size="10">accept any order</text></g>
  <path d="M880 206H932" stroke="#42515F" stroke-width="2"/><path d="M924 200L934 206L924 212" stroke="#7CFFB2" stroke-width="2"/>
  <g transform="translate(934 154)"><rect width="232" height="104" rx="16" fill="#101720" stroke="#2D3A48"/><text x="16" y="25" fill="#7CFFB2" font-family="monospace" font-size="11">05 / RECONSTRUCT</text><text x="16" y="53" fill="#F4F8FC" font-family="Arial" font-size="19" font-weight="700">Verify + recover</text><text x="16" y="76" fill="#8D9AA8" font-family="monospace" font-size="10">payload CRC → decompress</text><text x="16" y="92" fill="#8D9AA8" font-family="monospace" font-size="10">file CRC → preview / save</text></g>
  <rect x="32" y="287" width="310" height="4" rx="2" fill="url(#sig)"/>
</svg>