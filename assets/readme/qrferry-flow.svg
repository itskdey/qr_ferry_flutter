<svg width="1600" height="650" viewBox="0 0 1600 650" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E6DFD1" stroke-width="1"/></pattern></defs><rect width="1600" height="650" rx="28" fill="#F6F1E7"/><rect width="1600" height="650" rx="28" fill="url(#grid)"/><rect x="1.5" y="1.5" width="1597" height="647" rx="26.5" stroke="#E0D7C7" stroke-width="3"/><text x="48" y="54" fill="#7A8794" font-family="monospace" font-size="14">VISIBLE-LIGHT TRANSFER PIPELINE</text><text x="48" y="108" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">How a file crosses the gap</text><text x="48" y="145" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="21">No socket. No cloud. Just encoded frames moving through the camera.</text><g transform="translate(54 212)"><rect x="10" y="12" width="310" height="300" rx="22" fill="#111820" opacity=".15"/><rect width="310" height="300" rx="22" fill="#111820"/><text x="26" y="42" fill="#D7FF64" font-family="monospace" font-size="15">01 / PREPARE</text><text x="26" y="86" fill="#F6F1E7" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Package the file</text><text x="26" y="130" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="18">Read bytes</text><text x="26" y="160" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="18">Try gzip compression</text><text x="26" y="190" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="18">Split into numbered chunks</text><text x="26" y="220" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="18">Attach metadata + CRC32</text><rect x="26" y="252" width="116" height="32" rx="9" fill="#F6F1E7"/><text x="43" y="273" fill="#111820" font-family="monospace" font-size="13">sender.side</text></g><g transform="translate(414 212)"><rect x="10" y="12" width="310" height="300" rx="22" fill="#111820" opacity=".15"/><rect width="310" height="300" rx="22" fill="#FFFDF8" stroke="#111820" stroke-width="2"/><text x="26" y="42" fill="#7A8794" font-family="monospace" font-size="15">02 / BROADCAST</text><text x="26" y="86" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Animate QR frames</text><text x="26" y="130" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="18">Raw QR byte mode</text><text x="26" y="160" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="18">5 / 8 / 12 FPS</text><text x="26" y="190" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="18">Loop until all chunks land</text><text x="26" y="220" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="18">Display becomes transmitter</text><rect x="26" y="252" width="132" height="32" rx="9" fill="#111820"/><text x="43" y="273" fill="#F6F1E7" font-family="monospace" font-size="13">visible.light</text></g><g transform="translate(774 212)"><rect x="10" y="12" width="310" height="300" rx="22" fill="#111820" opacity=".15"/><rect width="310" height="300" rx="22" fill="#111820"/><text x="26" y="42" fill="#D7FF64" font-family="monospace" font-size="15">03 / RECEIVE</text><text x="26" y="86" fill="#F6F1E7" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Scan + validate</text><text x="26" y="130" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="18">Camera decodes QR bytes</text><text x="26" y="160" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="18">Reject corrupt frames</text><text x="26" y="190" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="18">Ignore duplicates</text><text x="26" y="220" fill="#D7E0EA" font-family="Arial,Helvetica,sans-serif" font-size="18">Collect chunks in any order</text><rect x="26" y="252" width="132" height="32" rx="9" fill="#F6F1E7"/><text x="43" y="273" fill="#111820" font-family="monospace" font-size="13">camera.input</text></g><g transform="translate(1134 212)"><rect x="10" y="12" width="410" height="300" rx="22" fill="#111820" opacity=".15"/><rect width="410" height="300" rx="22" fill="#FFFDF8" stroke="#111820" stroke-width="2"/><text x="26" y="42" fill="#7A8794" font-family="monospace" font-size="15">04 / RECONSTRUCT + VERIFY</text><text x="26" y="86" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Rebuild locally</text><text x="26" y="130" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="18">Reassemble by index</text><text x="26" y="160" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="18">Verify transmitted CRC32</text><text x="26" y="190" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="18">Decompress if needed</text><text x="26" y="220" fill="#4F5D6C" font-family="Arial,Helvetica,sans-serif" font-size="18">Verify final size + CRC32</text><rect x="26" y="252" width="108" height="32" rx="9" fill="#D7FF64" stroke="#111820" stroke-width="2"/><text x="44" y="273" fill="#111820" font-family="monospace" font-size="13">VERIFIED</text></g><path d="M366 364H410" stroke="#111820" stroke-width="3" stroke-dasharray="8 7"/><path d="M394 354L412 364L394 374" stroke="#D7FF64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M726 364H770" stroke="#111820" stroke-width="3" stroke-dasharray="8 7"/><path d="M754 354L772 364L754 374" stroke="#D7FF64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1086 364H1130" stroke="#111820" stroke-width="3" stroke-dasharray="8 7"/><path d="M1114 354L1132 364L1114 374" stroke="#D7FF64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="54" y="560" width="1492" height="42" rx="11" fill="#111820"/><text x="78" y="586" fill="#F6F1E7" font-family="monospace" font-size="14">missed frames recover on the next loop  ·  duplicate chunks are ignored  ·  transfer metadata repeats in every frame</text></svg>