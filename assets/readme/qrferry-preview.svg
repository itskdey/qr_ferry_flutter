<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223142" opacity="0.34"/></pattern>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6EE7FF"/><stop offset="1" stop-color="#D8FF72"/></linearGradient>
  </defs>
  <rect width="1200" height="280" rx="24" fill="#0A0F14"/><rect width="1200" height="280" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="278" rx="23" stroke="#293746" stroke-width="2"/>
  <text x="32" y="38" fill="#748291" font-family="monospace" font-size="12">INTERFACE / TRANSFER TELEMETRY</text>
  <text x="32" y="80" fill="#F4F8FC" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">The UI treats a transfer like a live instrument panel.</text>
  <text x="32" y="108" fill="#AAB6C3" font-family="Arial,Helvetica,sans-serif" font-size="16">Prepare the file, broadcast frames, collect signal, verify the result.</text>

  <g transform="translate(32 142)"><rect width="250" height="94" rx="16" fill="#101720" stroke="#2D3A48"/><text x="16" y="23" fill="#6EE7FF" font-family="monospace" font-size="10">01 / PREPARE</text><text x="16" y="50" fill="#F4F8FC" font-family="Arial" font-size="18" font-weight="700">Choose source file</text><rect x="16" y="66" width="156" height="7" rx="3.5" fill="#1A252F"/><rect x="16" y="66" width="92" height="7" rx="3.5" fill="#6EE7FF" opacity=".8"/><text x="184" y="74" fill="#7F8D9B" font-family="monospace" font-size="9">READY</text></g>
  <g transform="translate(306 142)"><rect width="250" height="94" rx="16" fill="#101720" stroke="#2D3A48"/><text x="16" y="23" fill="#D8FF72" font-family="monospace" font-size="10">02 / BROADCAST</text><text x="16" y="50" fill="#F4F8FC" font-family="Arial" font-size="18" font-weight="700">Stream QR frames</text><rect x="16" y="64" width="38" height="22" rx="5" fill="#F4F8FC"/><rect x="22" y="70" width="8" height="8" fill="#0A0F14"/><rect x="38" y="70" width="8" height="8" fill="#0A0F14"/><text x="72" y="79" fill="#AAB6C3" font-family="monospace" font-size="9">143 / 201 · 8 FPS</text></g>
  <g transform="translate(580 142)"><rect width="250" height="94" rx="16" fill="#101720" stroke="#2D3A48"/><text x="16" y="23" fill="#6EE7FF" font-family="monospace" font-size="10">03 / RECEIVE</text><text x="16" y="50" fill="#F4F8FC" font-family="Arial" font-size="18" font-weight="700">Collect unique chunks</text><rect x="16" y="66" width="182" height="7" rx="3.5" fill="#1A252F"/><rect x="16" y="66" width="128" height="7" rx="3.5" fill="url(#sig)"/><text x="205" y="74" fill="#7F8D9B" font-family="monospace" font-size="9">71%</text></g>
  <g transform="translate(854 142)"><rect width="314" height="94" rx="16" fill="#101720" stroke="#2D3A48"/><text x="16" y="23" fill="#7CFFB2" font-family="monospace" font-size="10">04 / VERIFIED</text><text x="16" y="50" fill="#F4F8FC" font-family="Arial" font-size="18" font-weight="700">Preview · save · share</text><circle cx="28" cy="73" r="9" fill="#142B24" stroke="#2D6A50"/><path d="M23 73L27 77L34 69" stroke="#7CFFB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="77" fill="#AAB6C3" font-family="monospace" font-size="9">final CRC32 matches</text></g>
  <rect x="32" y="256" width="260" height="4" rx="2" fill="url(#sig)"/>
</svg>