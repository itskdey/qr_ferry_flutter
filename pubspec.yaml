name: qr_ferry_flutter
description: Offline file transfer over animated QR codes. Flutter MVP inspired by QRFerry.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3

  mobile_scanner: ^7.4.0
  path_provider: ^2.1.6
  qr: ^4.0.0
  file_picker: ^11.0.3
  share_plus: ^11.1.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/logo/app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/img/logo/app_logo.png"
  adaptive_icon_foreground: "assets/img/logo/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/img/logo/
